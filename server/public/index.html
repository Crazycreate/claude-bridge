<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Claude Bridge — dev test</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100dvh;
      background: #0f1115; color: #e6e6e6;
    }
    header {
      padding: 10px 14px; background: #161a22; border-bottom: 1px solid #262c38;
      display: flex; gap: 10px; align-items: center;
    }
    header b { font-weight: 600; }
    #state { font-size: 12px; color: #8b94a7; margin-left: auto; }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 11px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: #2d4a7c; }
    .assistant { align-self: flex-start; background: #1d2330; }
    .tool { align-self: flex-start; background: #2a2118; font-size: 13px; }
    .result { align-self: center; color: #8b94a7; font-size: 12px; }
    .perm { align-self: flex-start; background: #3a2230; }
    .perm button { margin: 6px 6px 0 0; padding: 5px 12px; border: 0; border-radius: 7px; cursor: pointer; }
    .allow { background: #2f7d4f; color: #fff; }
    .deny { background: #8c3a3a; color: #fff; }
    footer { display: flex; gap: 8px; padding: 10px; background: #161a22; border-top: 1px solid #262c38; }
    input, textarea { font: inherit; }
    #text { flex: 1; resize: none; padding: 9px 11px; border-radius: 9px; border: 1px solid #333b4a; background: #0f1115; color: inherit; }
    button.send, button.stop { padding: 0 16px; border: 0; border-radius: 9px; cursor: pointer; font-weight: 600; }
    button.send { background: #3b6fd6; color: #fff; }
    button.stop { background: #8c3a3a; color: #fff; }
  </style>
</head>
<body>
  <header>
    <b>Claude Bridge</b>
    <span id="state">connecting…</span>
  </header>
  <div id="log"></div>
  <footer>
    <textarea id="text" rows="1" placeholder="Message Claude Code…"></textarea>
    <button class="send" id="send">Send</button>
    <button class="stop" id="stop">Stop</button>
  </footer>

  <script>
    const log = document.getElementById('log');
    const stateEl = document.getElementById('state');
    const textEl = document.getElementById('text');

    function add(cls, html) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.innerHTML = html;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    // Token: kept in localStorage so reloads stay connected during dev.
    let token = localStorage.getItem('bridge_token');
    if (!token) { token = prompt('AUTH_TOKEN:') || ''; localStorage.setItem('bridge_token', token); }

    let ws;
    function connect() {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
      ws.onopen = () => { stateEl.textContent = 'authenticating…'; ws.send(JSON.stringify({ type: 'auth', token })); };
      ws.onclose = () => { stateEl.textContent = 'disconnected — retrying'; setTimeout(connect, 2000); };
      ws.onmessage = (ev) => handle(JSON.parse(ev.data));
    }

    function handle(m) {
      switch (m.type) {
        case 'auth_ok': stateEl.textContent = 'connected'; break;
        case 'auth_error': stateEl.textContent = 'auth failed'; localStorage.removeItem('bridge_token'); break;
        case 'status': stateEl.textContent = m.state; break;
        case 'user_echo': add('me', esc(m.text)); break;
        case 'assistant': add('assistant', esc(m.text)); break;
        case 'tool_use': add('tool', '🔧 <b>' + esc(m.name) + '</b>\n' + esc(JSON.stringify(m.input))); break;
        case 'tool_result': add('tool', (m.isError ? '⚠️ ' : '✓ ') + esc(JSON.stringify(m.content)).slice(0, 800)); break;
        case 'result': add('result', 'turn done · ' + m.subtype + ' · ' + m.durationMs + 'ms'); break;
        case 'error': add('result', '❌ ' + esc(m.message)); break;
        case 'permission_request': {
          const el = add('perm', '🔐 Allow <b>' + esc(m.toolName) + '</b>?\n' + esc(JSON.stringify(m.input)));
          const decide = (decision) => { ws.send(JSON.stringify({ type: 'permission', id: m.id, decision })); el.querySelectorAll('button').forEach(b => b.disabled = true); };
          const a = document.createElement('button'); a.className = 'allow'; a.textContent = 'Allow'; a.onclick = () => decide('allow');
          const d = document.createElement('button'); d.className = 'deny'; d.textContent = 'Deny'; d.onclick = () => decide('deny');
          el.append(a, d);
          break;
        }
      }
    }

    function sendPrompt() {
      const text = textEl.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'prompt', text }));
      textEl.value = '';
    }
    document.getElementById('send').onclick = sendPrompt;
    document.getElementById('stop').onclick = () => ws.send(JSON.stringify({ type: 'interrupt' }));
    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
    });

    connect();
  </script>
</body>
</html>
